<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIO Terreno | Captura de Ronda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 32, 54, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card-terreno {
      width: 100%; max-width: 520px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px; backdrop-filter: blur(20px); box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; text-transform: uppercase; color: var(--accent); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; background: rgba(10, 15, 29, 0.85); border: 1px solid var(--border); color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .btn-action {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); color: #fff; padding: 10px;
      border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center; display: block;
    }
    .btn-action:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); }
    .preview-box { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; padding: 8px; border: 1px dashed var(--border); border-radius: 8px; margin-top: 10px; }
    .preview-item { position: relative; display: inline-block; }
    .preview-item img, .preview-item video { width: 90px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .preview-item button { position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; font-size: 11px; }
    .btn-submit { width: 100%; background: #0284c7; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 0.95rem; color: #fff; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="card-terreno">
    <h2>📸 Registro Ronda en Terreno</h2>

    <div class="form-group">
      <label>TAG del Equipo</label>
      <input type="text" id="terrTag" placeholder="Ej: MH2709" class="code-font" />
    </div>

    <div class="form-group">
      <label>Severidad Visual / Hallazgo</label>
      <select id="terrSev">
        <option value="Verde">Verde (Normal / Seguimiento)</option>
        <option value="Amarillo">Amarillo (Alerta)</option>
        <option value="Naranja">Naranja (Atención Urgente)</option>
        <option value="Rojo">Rojo (Crítico)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Detalle de la Observación</label>
      <textarea id="terrDetalle" rows="3" placeholder="Fuga de lubricante, soltura basal, vibración anómala..."></textarea>
    </div>

    <div class="form-group">
      <label>Evidencias (Galería, Cámara o Video Corto)</label>
      <div class="grid-btns">
        <label class="btn-action">
          📁 Desde Memoria
          <input type="file" id="terrInputGaleria" accept="image/*,video/*" multiple style="display:none;" onchange="procesarArchivos(event)" />
        </label>
        <label class="btn-action" style="border-color:#38bdf8;">
          📷 Tomar Foto
          <input type="file" id="terrInputCam" accept="image/*" capture="environment" style="display:none;" onchange="procesarArchivos(event)" />
        </label>
      </div>

      <label class="btn-action" style="background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.4); color:#fca5a5;">
        🎥 Grabar Video Corto (Máx. 10s)
        <input type="file" id="terrInputVid" accept="video/*" capture="environment" style="display:none;" onchange="procesarVideo(event)" />
      </label>

      <div class="preview-box" id="terrPreviewBox">
        <span style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">Sin archivos seleccionados</span>
      </div>
    </div>

    <button type="button" class="btn-submit" onclick="enviarReporteTerreno()">💾 Guardar Reporte en Base de Datos</button>
  </div>

  <canvas id="resizeCanvas" style="display:none;"></canvas>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBd5MEZdMmgzBs1xCyeGYeKtQx5gJIeY3w",
      authDomain: "dashboard-vulnerabilidades-mlc.firebaseapp.com",
      databaseURL: "https://dashboard-vulnerabilidades-mlc-default-rtdb.firebaseio.com",
      projectId: "dashboard-vulnerabilidades-mlc"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var dbTerreno = firebase.database().ref('alertas_terreno_dev');
    var evidenciasLocales = [];

    function procesarArchivos(event) {
      var files = Array.from(event.target.files);
      if (!files.length) return;
      var canvas = document.getElementById('resizeCanvas');
      var ctx = canvas.getContext('2d');

      files.forEach(function(file) {
        if (file.type.startsWith('image/')) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
              var MAX = 900;
              var w = img.width, h = img.height;
              if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
              canvas.width = w; canvas.height = h;
              ctx.drawImage(img, 0, 0, w, h);
              evidenciasLocales.push({ tipo: 'imagen', data: canvas.toDataURL('image/jpeg', 0.65) });
              renderPreview();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        } else if (file.type.startsWith('video/')) {
          procesarVideoArchivo(file);
        }
      });
      event.target.value = '';
    }

    function procesarVideo(event) {
      var file = event.target.files[0];
      if (file) procesarVideoArchivo(file);
      event.target.value = '';
    }

    function procesarVideoArchivo(file) {
      if (file.size > 10 * 1024 * 1024) {
        alert("⚠️ El video supera los 10 MB permitidos. Debe durar menos de 10 segundos.");
        return;
      }
      var vid = document.createElement('video');
      vid.preload = 'metadata';
      vid.onloadedmetadata = function() {
        window.URL.revokeObjectURL(vid.src);
        if (vid.duration > 12) {
          alert("⚠️ El video supera los 10 segundos máximos.");
          return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
          evidenciasLocales.push({ tipo: 'video', data: e.target.result });
          renderPreview();
        };
        reader.readAsDataURL(file);
      };
      vid.src = URL.createObjectURL(file);
    }

    function renderPreview() {
      var box = document.getElementById('terrPreviewBox');
      if (!evidenciasLocales.length) {
        box.innerHTML = '<span style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">Sin archivos seleccionados</span>';
        return;
      }
      box.innerHTML = evidenciasLocales.map(function(item, idx) {
        var el = item.tipo === 'video'
          ? '<video src="' + item.data + '" controls></video>'
          : '<img src="' + item.data + '" />';
        return '<div class="preview-item">' + el + '<button onclick="eliminarEvidencia(' + idx + ')">&times;</button></div>';
      }).join('');
    }

    function eliminarEvidencia(idx) {
      evidenciasLocales.splice(idx, 1);
      renderPreview();
    }

    function enviarReporteTerreno() {
      var tag = document.getElementById('terrTag').value.trim();
      var sev = document.getElementById('terrSev').value;
      var detalle = document.getElementById('terrDetalle').value.trim();

      if (!tag) { alert("⚠️ Ingresa el TAG del equipo."); return; }
      if (!detalle) { alert("⚠️ Describe la observación encontrada."); return; }

      var primeraFoto = evidenciasLocales.find(function(e) { return e.tipo === 'imagen'; });

      var payload = {
        tag: tag.toUpperCase(),
        severidad: sev,
        detalle: detalle,
        evidencias: evidenciasLocales,
        fotoBase64: primeraFoto ? primeraFoto.data : '',
        timestamp: new Date().toISOString()
      };

      dbTerreno.push(payload).then(function() {
        alert("✅ Reporte registrado con éxito.");
        document.getElementById('terrTag').value = '';
        document.getElementById('terrDetalle').value = '';
        evidenciasLocales = [];
        renderPreview();
      }).catch(function(err) {
        alert("❌ Error: " + err.message);
      });
    }
  </script>
</body>
</html>
