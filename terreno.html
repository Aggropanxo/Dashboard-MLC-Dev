<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CIO Terreno | Ronda OEM Predictiva</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --glass-glow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --input-bg: rgba(10, 16, 30, 0.85);
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #eab308;
      --green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at 50% 0%, #151d30 0%, #090d16 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .code-font { font-family: 'JetBrains Mono', monospace; }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), var(--glass-glow);
      backdrop-filter: blur(16px);
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f87171;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 800;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), var(--glass-glow);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    .chips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      transition: all 0.2s;
    }

    .chip-btn:hover, .chip-btn:active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: #fff;
    }

    .sev-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sev-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sev-btn.active-rojo {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: #fca5a5;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
    }

    .sev-btn.active-naranja {
      background: rgba(249, 115, 22, 0.2);
      border-color: var(--orange);
      color: #fdba74;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.35);
    }

    .sev-btn.active-amarillo {
      background: rgba(234, 179, 8, 0.2);
      border-color: var(--yellow);
      color: #fde047;
      box-shadow: 0 0 14px rgba(234, 179, 8, 0.35);
    }

    .media-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px;
    }

    .btn-media {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 9px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .btn-media:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    .btn-video-record {
      width: 100%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 9px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .btn-video-record:hover { background: rgba(239, 68, 68, 0.2); }

    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
      padding: 8px;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      margin-top: 6px;
    }

    .preview-card { position: relative; display: inline-block; }
    .preview-card img, .preview-card video {
      width: 90px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      display: block;
    }

    .preview-card button {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      cursor: pointer;
      line-height: 1;
      z-index: 2;
    }

    .btn-transmitir {
      width: 100%;
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border: 1px solid #f87171;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4), var(--glass-glow);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-transmitir:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HEADER STATUS ONLINE / OFFLINE -->
    <header class="header-card">
      <div class="header-title">
        <span>📱</span> TERRENO / RONDA OEM
      </div>
      <div class="status-badge" id="netStatusBadge">
        <span class="status-dot"></span> ONLINE / SYNC OK
      </div>
    </header>

    <!-- FORMULARIO INTEGRADO -->
    <main class="form-card">

      <!-- 1. FAENA OPERATIVA -->
      <div class="form-group">
        <label>1. Faena Operativa</label>
        <select id="selFaena" onchange="actualizarAreasPorFaena()">
          <option value="Planta, Mina los Colorados">Planta, Mina los Colorados</option>
          <option value="Mina, Mina los Colorados">Mina, Mina los Colorados</option>
          <option value="Planta de Pellets">Planta de Pellets</option>
          <option value="Planta, Mina el Romeral">Planta, Mina el Romeral</option>
          <option value="Mina, Mina el Romeral">Mina, Mina el Romeral</option>
        </select>
      </div>

      <!-- 2. ÁREA OPERACIONAL -->
      <div class="form-group">
        <label>2. Área Operacional</label>
        <select id="selArea" onchange="actualizarEquiposPorArea()">
          <option value="">-- Selecciona el Área --</option>
        </select>
      </div>

      <!-- 3. EQUIPO / TAG DEL CATASTRO O LIBRE -->
      <div class="form-group">
        <label>3. Equipo / TAG del Catastro</label>
        <select id="selEquipo" onchange="sincronizarTagLibre(this.value)">
          <option value="">-- SELECCIONA EL EQUIPO --</option>
        </select>
        <span style="font-size:0.68rem; color:var(--text-muted); margin-top:2px;">O escribe si es un hallazgo libre:</span>
        <input type="text" id="inputTagLibre" placeholder="EJ: MH2709 (OPCIONAL)" class="code-font" style="text-transform: uppercase;" />
      </div>

      <!-- 4. COMPONENTE / ELEMENTO (ESCRITURA LIBRE) -->
      <div class="form-group">
        <label>4. Componente / Elemento Afectado</label>
        <input type="text" id="inputComponenteLibre" placeholder="Ej: Motor M1 lado acople, Reductor G1, Chumacera N°2, Tambor retorno..." />
      </div>

      <!-- 5. CATÁLOGO EXTENDIDO DE HALLAZGOS RÁPIDOS -->
      <div class="form-group">
        <label>5. Hallazgos Frecuentes en Terreno</label>
        <div class="chips-grid">
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('🛢️ Fuga de lubricante (aceite/grasa)')">🛢️ Fuga de aceite</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('📢 Ruido anómalo / golpeteo interno')">📢 Ruido reductor</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('⚠️ Vibración perceptible al tacto')">⚠️ Vibración alta</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('🔥 Temperatura anormal en descanso')">🔥 Alta temperatura</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('🔩 Perno basal cortado o soltura mecánica')">🔩 Perno / Soltura basal</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('🧴 Grasa degradada o purga contaminada')">🧴 Grasa degradada</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('⚡ Conexión eléctrica recalentada')">⚡ Recalentamiento</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('💨 Fuga de aire o sistema de venteo tapado')">💨 Fuga aire / Venteo</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('⚙️ Desalineación poleas o acople dañado')">⚙️ Acople / Desalineación</button>
          <button type="button" class="chip-btn" onclick="agregarHallazgoRapido('🛡️ Protección suelta o rozamiento con eje')">🛡️ Guarda / Rozamiento</button>
        </div>
      </div>

      <!-- 6. NOTAS / DETALLE DEL HALLAZGO -->
      <div class="form-group">
        <label>6. Notas / Detalle del Hallazgo</label>
        <textarea id="txtDetalle" rows="3" placeholder="Ej: Se observa fuga activa por retén de entrada y soltura en perno basal frontal..."></textarea>
      </div>

      <!-- 7. EVIDENCIAS MULTIMEDIA -->
      <div class="form-group">
        <label>7. Evidencias Multimedia (Fotos / Galería / Video Corto)</label>
        
        <div class="media-actions-grid">
          <label class="btn-media">
            📁 Desde Memoria
            <input type="file" id="inputGaleria" accept="image/*,video/*" multiple style="display:none;" onchange="procesarArchivosMultimedia(event)" />
          </label>

          <label class="btn-media" style="border-color: var(--accent);">
            📷 Tomar Foto
            <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display:none;" onchange="procesarArchivosMultimedia(event)" />
          </label>
        </div>

        <label class="btn-video-record">
          🎥 Grabar Video Corto (Máx. 10s)
          <input type="file" id="inputVideo" accept="video/*" capture="environment" style="display:none;" onchange="procesarVideoDirecto(event)" />
        </label>

        <div class="preview-container" id="previewBox">
          <span style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">Sin archivos adjuntos aún.</span>
        </div>
      </div>

      <!-- 8. SEVERIDAD PRELIMINAR -->
      <div class="form-group">
        <label>8. Severidad Preliminar</label>
        <div class="sev-grid">
          <button type="button" class="sev-btn active-rojo" id="btnSevRojo" onclick="seleccionarSeveridad('Rojo')">🔴 Crítico</button>
          <button type="button" class="sev-btn" id="btnSevNaranja" onclick="seleccionarSeveridad('Naranja')">🟠 Alerta</button>
          <button type="button" class="sev-btn" id="btnSevAmarillo" onclick="seleccionarSeveridad('Amarillo')">🟡 Seguimiento</button>
        </div>
      </div>

      <!-- TRANSMISIÓN A SALA CIO -->
      <button type="button" class="btn-transmitir" id="btnTransmitir" onclick="transmitirReporteSalaCIO()">
        📡 Transmitir a Sala CIO en Tiempo Real
      </button>

    </main>
  </div>

  <canvas id="resizeCanvas" style="display:none;"></canvas>

  <script>
    'use strict';

    var firebaseConfig = {
      apiKey: "AIzaSyBd5MEZdMmgzBs1xCyeGYeKtQx5gJIeY3w",
      authDomain: "dashboard-vulnerabilidades-mlc.firebaseapp.com",
      databaseURL: "https://dashboard-vulnerabilidades-mlc-default-rtdb.firebaseio.com",
      projectId: "dashboard-vulnerabilidades-mlc"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var dbEquipos = firebase.database().ref('activos_criticos_dev');
    var dbAlertas = firebase.database().ref('alertas_terreno_dev');

    var catalogoEquipos = [];
    var evidenciasTemporales = [];
    var severidadSeleccionada = 'Rojo';

    // 1. MONITOR DE CONECTIVIDAD & DESPACHO AUTOMÁTICO OFFLINE
    function getQueue() {
      try {
        return JSON.parse(localStorage.getItem('CIO_OFFLINE_QUEUE') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveQueue(q) {
      try {
        localStorage.setItem('CIO_OFFLINE_QUEUE', JSON.stringify(q));
      } catch (e) {
        console.warn("Storage lleno:", e);
      }
    }

    function actualizarEstadoRed() {
      var badge = document.getElementById('netStatusBadge');
      if (!badge) return;
      var queue = getQueue();

      if (navigator.onLine) {
        if (queue.length > 0) {
          badge.innerHTML = '<span class="status-dot" style="background:#38bdf8;box-shadow:0 0 8px #38bdf8;"></span> SINCRONIZANDO (' + queue.length + ')...';
          badge.style.color = '#38bdf8';
          badge.style.borderColor = 'rgba(56, 189, 248, 0.4)';
          sincronizarColaOffline();
        } else {
          badge.innerHTML = '<span class="status-dot"></span> ONLINE / SYNC OK';
          badge.style.color = '#4ade80';
          badge.style.borderColor = 'rgba(34, 197, 94, 0.4)';
        }
      } else {
        badge.innerHTML = '<span class="status-dot" style="background:#f97316;box-shadow:0 0 8px #f97316;"></span> OFFLINE / COLA (' + queue.length + ')';
        badge.style.color = '#fdba74';
        badge.style.borderColor = 'rgba(249, 115, 22, 0.4)';
      }
    }

    window.addEventListener('online', function() {
      actualizarEstadoRed();
      sincronizarColaOffline();
    });
    window.addEventListener('offline', actualizarEstadoRed);

    function sincronizarColaOffline() {
      if (!navigator.onLine) return;
      var queue = getQueue();
      if (queue.length === 0) return;

      var itemsToSend = queue.slice();
      var promesas = itemsToSend.map(function(item) {
        return dbAlertas.push(item);
      });

      Promise.all(promesas).then(function() {
        localStorage.removeItem('CIO_OFFLINE_QUEUE');
        actualizarEstadoRed();
        alert("✅ Conexión restablecida: " + itemsToSend.length + " reporte(s) offline sincronizados con Sala CIO.");
      }).catch(function(err) {
        console.warn("Error al sincronizar cola:", err);
      });
    }

    actualizarEstadoRed();

    // 2. Carga en tiempo real de equipos del catastro
    dbEquipos.on('value', function(snap) {
      var raw = snap.val();
      if (!raw) return;
      catalogoEquipos = Object.keys(raw).map(function(k) {
        var item = raw[k] || {};
        return {
          id: k,
          siteId: item.siteId || 'Planta, Mina los Colorados',
          area: item.area || 'Sin Área',
          tag: item.tag || item.Tag || k
        };
      });
      actualizarAreasPorFaena();
    });

    function actualizarAreasPorFaena() {
      var faena = document.getElementById('selFaena').value;
      var selArea = document.getElementById('selArea');
      selArea.innerHTML = '<option value="">-- Selecciona el Área --</option>';

      var areasUnicas = [];
      catalogoEquipos.forEach(function(e) {
        if (e.siteId === faena && e.area && areasUnicas.indexOf(e.area) === -1) {
          areasUnicas.push(e.area);
        }
      });

      areasUnicas.sort().forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a;
        opt.innerText = a;
        selArea.appendChild(opt);
      });

      actualizarEquiposPorArea();
    }

    function actualizarEquiposPorArea() {
      var faena = document.getElementById('selFaena').value;
      var area = document.getElementById('selArea').value;
      var selEq = document.getElementById('selEquipo');
      selEq.innerHTML = '<option value="">-- SELECCIONA EL EQUIPO --</option>';

      var eqs = catalogoEquipos.filter(function(e) {
        return e.siteId === faena && (!area || e.area === area);
      });

      eqs.sort(function(a, b) { return a.tag.localeCompare(b.tag); }).forEach(function(e) {
        var opt = document.createElement('option');
        opt.value = e.tag;
        opt.innerText = e.tag;
        selEq.appendChild(opt);
      });
    }

    function sincronizarTagLibre(val) {
      var input = document.getElementById('inputTagLibre');
      if (val) input.value = val;
    }

    // 3. Hallazgos rápidos con concatenación
    function agregarHallazgoRapido(texto) {
      var txt = document.getElementById('txtDetalle');
      if (txt.value.trim().length > 0) {
        txt.value = txt.value.trim() + " | " + texto;
      } else {
        txt.value = texto;
      }
      txt.focus();
    }

    // 4. Selector de severidad táctil
    function seleccionarSeveridad(sev) {
      severidadSeleccionada = sev;
      document.getElementById('btnSevRojo').className = 'sev-btn' + (sev === 'Rojo' ? ' active-rojo' : '');
      document.getElementById('btnSevNaranja').className = 'sev-btn' + (sev === 'Naranja' ? ' active-naranja' : '');
      document.getElementById('btnSevAmarillo').className = 'sev-btn' + (sev === 'Amarillo' ? ' active-amarillo' : '');
    }

    // 5. Procesamiento de evidencias con compresión
    function procesarArchivosMultimedia(event) {
      var files = Array.from(event.target.files);
      if (!files.length) return;

      var canvas = document.getElementById('resizeCanvas');
      var ctx = canvas.getContext('2d');
      var procesados = 0;

      files.forEach(function(file) {
        if (file.type.startsWith('image/')) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
              var MAX = 850;
              var w = img.width, h = img.height;
              if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
              canvas.width = w; canvas.height = h;
              ctx.drawImage(img, 0, 0, w, h);

              evidenciasTemporales.push({
                tipo: 'imagen',
                data: canvas.toDataURL('image/jpeg', 0.60)
              });

              procesados++;
              if (procesados === files.length) renderizarPreview();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        } else if (file.type.startsWith('video/')) {
          validarYProcesarVideo(file);
        }
      });

      event.target.value = '';
    }

    // 6. Grabación y límite de video (10 segundos)
    function procesarVideoDirecto(event) {
      var file = event.target.files[0];
      if (file) validarYProcesarVideo(file);
      event.target.value = '';
    }

    function validarYProcesarVideo(file) {
      if (file.size > 8 * 1024 * 1024) {
        alert("⚠️ El video pesa más de 8 MB. Graba un clip de máximo 5 a 10 segundos.");
        return;
      }

      var vid = document.createElement('video');
      vid.preload = 'metadata';
      vid.onloadedmetadata = function() {
        window.URL.revokeObjectURL(vid.src);
        if (vid.duration > 12) {
          alert("⚠️ El video dura " + Math.round(vid.duration) + "s. El límite máximo son 10 segundos.");
          return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
          evidenciasTemporales.push({
            tipo: 'video',
            data: e.target.result
          });
          renderizarPreview();
        };
        reader.readAsDataURL(file);
      };
      vid.src = URL.createObjectURL(file);
    }

    function renderizarPreview() {
      var box = document.getElementById('previewBox');
      if (!evidenciasTemporales.length) {
        box.innerHTML = '<span style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">Sin archivos adjuntos aún.</span>';
        return;
      }

      box.innerHTML = evidenciasTemporales.map(function(item, idx) {
        var content = item.tipo === 'video'
          ? '<video src="' + item.data + '" controls></video>'
          : '<img src="' + item.data + '" />';
        return '<div class="preview-card">' +
            content +
            '<button type="button" onclick="eliminarEvidenciaTemporal(' + idx + ')">&times;</button>' +
          '</div>';
      }).join('');
    }

    function eliminarEvidenciaTemporal(idx) {
      evidenciasTemporales.splice(idx, 1);
      renderizarPreview();
    }

    // 7. TRANSMISIÓN CON GUARDADO LOCAL AUTOMÁTICO ANTE CAÍDA DE RED
    function transmitirReporteSalaCIO() {
      var tagFinal = document.getElementById('inputTagLibre').value.trim() || document.getElementById('selEquipo').value;
      var componenteFinal = document.getElementById('inputComponenteLibre').value.trim();
      var faena = document.getElementById('selFaena').value;
      var area = document.getElementById('selArea').value || 'Área General';
      var detalle = document.getElementById('txtDetalle').value.trim();
      var btn = document.getElementById('btnTransmitir');

      if (!tagFinal) {
        alert("⚠️ Por favor selecciona o ingresa el TAG del equipo.");
        return;
      }

      if (!componenteFinal) {
        alert("⚠️ Por favor escribe el componente afectado (ej: Motor M1, Reductor, Chumacera...).");
        document.getElementById('inputComponenteLibre').focus();
        return;
      }

      if (!detalle && evidenciasTemporales.length === 0) {
        alert("⚠️ Ingresa notas del hallazgo o adjunta una fotografía/video.");
        return;
      }

      var primerFoto = evidenciasTemporales.find(function(e) { return e.tipo === 'imagen'; });
      var detalleCompleto = "[" + componenteFinal + "]: " + (detalle || 'Inspección visual de rutina efectuada en terreno.');

      var payload = {
        faena: faena,
        area: area,
        tag: tagFinal.toUpperCase(),
        componente: componenteFinal,
        severidad: severidadSeleccionada,
        detalle: detalleCompleto,
        evidencias: evidenciasTemporales,
        fotoBase64: primerFoto ? primerFoto.data : '',
        timestamp: new Date().toISOString()
      };

      var limpiarFormulario = function() {
        document.getElementById('txtDetalle').value = '';
        document.getElementById('inputTagLibre').value = '';
        document.getElementById('inputComponenteLibre').value = '';
        document.getElementById('selEquipo').value = '';
        evidenciasTemporales = [];
        renderizarPreview();
        seleccionarSeveridad('Rojo');
        btn.disabled = false;
        btn.innerText = "📡 Transmitir a Sala CIO en Tiempo Real";
      };

      // Si no hay red, guardar en cola local de inmediato
      if (!navigator.onLine) {
        var queue = getQueue();
        queue.push(payload);
        saveQueue(queue);
        actualizarEstadoRed();
        alert("💾 MODO OFFLINE: Sin conexión en faena. El reporte quedó guardado de forma segura en la memoria de tu teléfono y se sincronizará automáticamente cuando retomes señal.");
        limpiarFormulario();
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ Transmitiendo a Sala CIO...";

      dbAlertas.push(payload).then(function() {
        alert("✅ TRANSMISIÓN EXITOSA: El hallazgo en " + componenteFinal + " (" + tagFinal.toUpperCase() + ") ya está activo en Sala CIO.");
        limpiarFormulario();
      }).catch(function(err) {
        // Fallback ante microcortes durante el envío
        var queue = getQueue();
        queue.push(payload);
        saveQueue(queue);
        actualizarEstadoRed();
        alert("⚠️ Falló el enlace de red (" + err.message + "). El reporte se guardó en la cola local de tu teléfono.");
        limpiarFormulario();
      });
    }
  </script>
